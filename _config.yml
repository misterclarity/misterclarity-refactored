title: Mister Clarity
tagline: AstroCartography & Transition Coaching
description: >-
  Transition coaching combined with precise AstroCartography — personalized
  location guidance to help you find the place where you are meant to thrive.
url: https://misterclarity.com
lang: en_US
timezone: Europe/Vienna
logo: /assets/images/logo.png

author:
  name: Vlad-Emil Petrea
  email: coach@misterclarity.com

social:
  name: Vlad-Emil Petrea
  links:
    - https://www.linkedin.com/in/vladpetrea

# Cloudflare Web Analytics. Paste the token from the dashboard snippet
# (dash.cloudflare.com -> Analytics & Logs -> Web Analytics -> Add a site).
# While this is empty, no analytics script is emitted at all.
cloudflare_analytics_token: ""

permalink: /blog/:title/
markdown: kramdown

exclude:
  - exampleSite
  - static
  - README.md
  - LICENSE
  # Local-only tooling. Never published: it talks to a tailnet-only LLM and
  # carries personal data. Run it with tools/resume-generator/serve.ps1.
  - tools

plugins:
  - jekyll-redirect-from
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
